name: Refresh calendar

on:
  schedule:
    # 12:00 UTC is 8:00 AM in Buffalo during daylight time, 7:00 AM in winter.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check venue websites
        run: node scripts/refresh-calendar.mjs
      - name: Open a pull request when listings change
        id: listings
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          commit-message: "Update show listings from venue websites"
          title: "Update show listings"
          body: "Daily check of the venue websites."
          branch: calendar/refresh
          delete-branch: true
      - name: Merge the listings pull request
        if: steps.listings.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.listings.outputs.pull-request-number }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
      - name: Publish the updated site
        if: steps.listings.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
